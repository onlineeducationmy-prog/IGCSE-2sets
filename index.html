        options: ["16", "18", "20", "22"],
        answer: 1,
        explanation: "The total is 5 × 18 = 90. The four known numbers total 72. The fifth number is 90 − 72 = 18.",
        catName: "Mathematics"
      },
      {
        q: "A bag contains 4 red, 5 blue, and 3 green counters. One counter is chosen at random. What is the probability that it is not blue?",
        options: ["5/12", "1/2", "7/12", "2/3"],
        answer: 2,
        explanation: "There are 12 counters in total. Seven are not blue, so the probability is 7/12.",
        catName: "Mathematics"
      },
      {
        q: "A sequence begins 2, 6, 12, 20, 30, ... Its nth term is n(n + 1). What is the 15th term?",
        options: ["210", "220", "225", "240"],
        answer: 3,
        explanation: "Using the given formula, the 15th term is 15(15 + 1) = 15 × 16 = 240.",
        catName: "Mathematics"
      },
      {
        q: "A triangle has angles in the ratio 2 : 3 : 4. What is the size of its largest angle?",
        options: ["60°", "70°", "80°", "90°"],
        answer: 2,
        explanation: "The ratio parts total 2 + 3 + 4 = 9. Each part is 180° ÷ 9 = 20°. The largest angle is 4 × 20° = 80°.",
        catName: "Mathematics"
      },
      {
        q: "A metal block has a mass of 360 g and a volume of 120 cm³. What is its density?",
        options: ["0.3 g/cm³", "2 g/cm³", "3 g/cm³", "4 g/cm³"],
        answer: 2,
        explanation: "Density = mass ÷ volume = 360 g ÷ 120 cm³ = 3 g/cm³.",
        catName: "Science"
      },
      {
        q: "Why does a metal spoon feel colder than a wooden spoon when both have been left in the same room?",
        options: [
          "Metal is always at a lower temperature than wood.",
          "Metal conducts heat away from the hand more quickly.",
          "Wood produces heat when touched.",
          "Metal contains no thermal energy."
        ],
        answer: 1,
        explanation: "Metal conducts thermal energy away from the hand more quickly than wood does.",
        catName: "Science"
      },
      {
        q: "Why do plants need light for photosynthesis?",
        options: [
          "Light provides the energy needed to make glucose.",
          "Light supplies the carbon dioxide used by the plant.",
          "Light turns oxygen directly into glucose.",
          "Light replaces the need for water."
        ],
        answer: 0,
        explanation: "Photosynthesis uses light energy to help convert carbon dioxide and water into glucose and oxygen.",
        catName: "Science"
      },
      {
        q: "A student connects two identical bulbs in series to a battery. What happens if one bulb is removed?",
        options: [
          "The other bulb becomes brighter.",
          "The other bulb remains equally bright.",
          "The circuit is broken and the other bulb goes out.",
          "The battery produces twice as much voltage."
        ],
        answer: 2,
        explanation: "Removing one bulb in a series circuit breaks the single path for current.",
        catName: "Science"
      },
      {
        q: "Which process changes water vapour into liquid water?",
        options: ["Evaporation", "Condensation", "Sublimation", "Melting"],
        answer: 1,
        explanation: "Condensation occurs when water vapour cools and changes into liquid water.",
        catName: "Science"
      },
      {
        q: "Which organ filters waste products from the blood and produces urine?",
        options: ["Heart", "Lungs", "Kidneys", "Small intestine"],
        answer: 2,
        explanation: "The kidneys filter the blood, removing wastes and excess water and salts to form urine.",
        catName: "Science"
      },
      {
        q: "Equal amounts of sugar are added to hot and cold water and stirred equally. The sugar dissolves faster in the hot water. What is the best explanation?",
        options: [
          "Hot water contains no water molecules.",
          "Particles in hot water move faster on average.",
          "Sugar becomes a different substance in hot water.",
          "Cold water cannot dissolve sugar."
        ],
        answer: 1,
        explanation: "At a higher temperature, water molecules have greater average kinetic energy and move faster.",
        catName: "Science"
      },
      {
        q: "Which statement about the planets in the Solar System is correct?",
        options: [
          "All planets have the same orbital period.",
          "Mercury takes longer to orbit the Sun than Earth.",
          "Planets farther from the Sun generally have longer orbital periods.",
          "Planets produce visible light through nuclear fusion in the same way as stars."
        ],
        answer: 2,
        explanation: "Planets farther from the Sun generally take longer to complete an orbit.",
        catName: "Science"
      }
    ];

    // State management
    let currentScreen = 'home';
    let activeSetId = 1;
    let activeQuestions = igcseQuestionsSet1;
    let currentQuestionIndex = 0;
    let userAnswers = {};
    let questionStatus = {};
    let timerSeconds = 35 * 60; // 35 minutes
    let timerInterval = null;

    window.onload = function() {
      renderScreen();
    };

    function goHome() {
      if (currentScreen === 'exam') {
        showCustomModal(
          'Exit Simulation?',
          'Are you sure you want to exit? Your exam progress and timer will be reset.',
          'Yes, Exit',
          () => {
            clearInterval(timerInterval);
            currentScreen = 'home';
            renderScreen();
          },
          true
        );
      } else {
        currentScreen = 'home';
        renderScreen();
      }
    }

    function selectSet(setId) {
      activeSetId = setId;
      activeQuestions = setId === 1 ? igcseQuestionsSet1 : igcseQuestionsSet2;
      startExam();
    }

    function startExam() {
      currentScreen = 'exam';
      currentQuestionIndex = 0;
      userAnswers = {};
      questionStatus = {};
      timerSeconds = 35 * 60;
      
      activeQuestions.forEach((_, idx) => {
        questionStatus[idx] = 'unanswered';
      });

      renderScreen();
      startTimer();
    }

    function startTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (timerSeconds > 0) {
          timerSeconds--;
          updateTimerDisplay();
        } else {
          clearInterval(timerInterval);
          submitExam();
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      const el = document.getElementById('timer-display');
      if (el) {
        const mins = Math.floor(timerSeconds / 60);
        const secs = timerSeconds % 60;
        el.innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        if (timerSeconds <= 300) {
          el.classList.add('text-rose-500', 'animate-pulse');
        }
      }
    }

    function renderScreen() {
      const main = document.getElementById('main-content');
      const backBtn = document.getElementById('back-btn');
      const subtitleEl = document.getElementById('header-subtitle');

      if (currentScreen === 'home') {
        backBtn.classList.add('opacity-50', 'pointer-events-none');
        subtitleEl.innerText = 'MRSM admission practice test';
        main.innerHTML = `
          <div class="flex flex-col items-center text-center my-auto py-2">
            <div class="w-20 h-20 bg-indigo-600 rounded-3xl flex items-center justify-center text-white shadow-xl shadow-indigo-200 mb-5">
              <i class="fa-solid fa-book-open text-3xl"></i>
            </div>
            <h2 class="text-2xl font-black text-slate-900 mb-2">IGCSE Simulation Portal</h2>
            <p class="text-xs text-slate-500 max-w-xs mb-6 leading-relaxed">
              Prepare for the MRSM IGCSE admission assessment with practice questions covering IQ, English, Mathematics, and Science. Select a set below to begin:
            </p>

            <div class="w-full space-y-3 mb-6">
              <button onclick="selectSet(1)" class="w-full p-4 bg-white hover:bg-indigo-50 border-2 border-indigo-200 hover:border-indigo-600 rounded-2xl shadow-sm transition flex items-center justify-between group">
                <div class="flex items-center space-x-3 text-left">
                  <div class="w-10 h-10 rounded-xl bg-indigo-100 text-indigo-600 flex items-center justify-center font-bold">1</div>
                  <div>
                    <h3 class="text-sm font-bold text-slate-900 group-hover:text-indigo-600">SIMULATION SET 1</h3>
                    <p class="text-[11px] text-slate-500">35 Questions • 35 Mins</p>
                  </div>
                </div>
                <i class="fa-solid fa-chevron-right text-indigo-400"></i>
              </button>

              <button onclick="selectSet(2)" class="w-full p-4 bg-white hover:bg-emerald-50 border-2 border-emerald-200 hover:border-emerald-600 rounded-2xl shadow-sm transition flex items-center justify-between group">
                <div class="flex items-center space-x-3 text-left">
                  <div class="w-10 h-10 rounded-xl bg-emerald-100 text-emerald-600 flex items-center justify-center font-bold">2</div>
                  <div>
                    <h3 class="text-sm font-bold text-slate-900 group-hover:text-emerald-600">SIMULATION SET 2</h3>
                    <p class="text-[11px] text-slate-500">35 Questions • 35 Mins</p>
                  </div>
                </div>
                <i class="fa-solid fa-chevron-right text-emerald-400"></i>
              </button>
            </div>

            <div class="w-full bg-white rounded-3xl p-4 shadow-sm border border-slate-200 text-left space-y-3">
              <div class="flex items-center space-x-3 text-xs text-slate-700 font-medium">
                <div class="w-6 h-6 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center"><i class="fa-solid fa-check text-[10px]"></i></div>
                <span>Automatic Grading & Timer</span>
              </div>
              <div class="flex items-center space-x-3 text-xs text-slate-700 font-medium">
                <div class="w-6 h-6 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center"><i class="fa-solid fa-lightbulb text-[10px]"></i></div>
                <span>Instant Answer Explanations</span>
              </div>
            </div>
          </div>
        `;
      } else if (currentScreen === 'exam') {
        backBtn.classList.remove('opacity-50', 'pointer-events-none');
        subtitleEl.innerText = `Simulation Set ${activeSetId} Mode`;
        renderExamQuestion();
      } else if (currentScreen === 'results') {
        backBtn.classList.remove('opacity-50', 'pointer-events-none');
        subtitleEl.innerText = `Simulation Set ${activeSetId} Report`;
        renderResults();
      }
    }

    function renderExamQuestion() {
      const main = document.getElementById('main-content');
      const q = activeQuestions[currentQuestionIndex];
      const selectedOpt = userAnswers[currentQuestionIndex];
      const isAnswered = selectedOpt !== undefined;
      const answeredCount = Object.keys(userAnswers).length;

      let optionsHtml = '';
      q.options.forEach((opt, idx) => {
        let btnClass = "bg-white border-slate-200 text-slate-700 hover:border-indigo-300";
        let iconHtml = `<div class="w-6 h-6 rounded-full border border-slate-300 flex items-center justify-center text-xs font-semibold mr-3">${String.fromCharCode(65 + idx)}</div>`;

        if (isAnswered) {
          if (idx === q.answer) {
            btnClass = "bg-emerald-50 border-emerald-500 text-emerald-900 shadow-sm";
            iconHtml = `<div class="w-6 h-6 rounded-full bg-emerald-500 text-white flex items-center justify-center text-xs mr-3"><i class="fa-solid fa-check"></i></div>`;
          } else if (idx === selectedOpt && selectedOpt !== q.answer) {
            btnClass = "bg-rose-50 border-rose-500 text-rose-900 shadow-sm";
            iconHtml = `<div class="w-6 h-6 rounded-full bg-rose-500 text-white flex items-center justify-center text-xs mr-3"><i class="fa-solid fa-xmark"></i></div>`;
          } else {
            btnClass = "bg-slate-50 border-slate-200 text-slate-400 opacity-60";
          }
        }

        optionsHtml += `
          <button onclick="selectOption(${idx})" ${isAnswered ? 'disabled' : ''} class="w-full text-left p-4 rounded-2xl border-2 transition flex items-center justify-between ${btnClass}">
            <div class="flex items-center space-x-3">
              ${iconHtml}
              <span class="text-sm font-semibold">${opt}</span>
            </div>
          </button>
        `;
      });

      main.innerHTML = `
        <div class="flex items-center justify-between mb-4 bg-white p-3 rounded-2xl border border-slate-200">
          <div class="flex items-center space-x-2">
            <span class="px-2.5 py-1 bg-indigo-50 text-indigo-700 font-bold text-[11px] rounded-lg">${q.catName}</span>
          </div>
          <div class="flex items-center space-x-1.5 text-slate-700 font-extrabold text-sm bg-slate-100 px-3 py-1 rounded-xl">
            <i class="fa-solid fa-clock text-indigo-600 text-xs"></i>
            <span id="timer-display">35:00</span>
          </div>
        </div>

        <div class="bg-white rounded-3xl p-5 shadow-sm border border-slate-200 mb-4">
          <div class="flex justify-between items-center mb-3">
            <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Question ${currentQuestionIndex + 1} of ${activeQuestions.length}</span>
            <button onclick="toggleFlag()" class="text-xs font-semibold px-2.5 py-1 rounded-lg border transition ${questionStatus[currentQuestionIndex] === 'flagged' ? 'bg-amber-100 border-amber-400 text-amber-700' : 'bg-slate-50 border-slate-200 text-slate-500 hover:bg-slate-100'}">
              <i class="fa-solid fa-flag mr-1"></i> ${questionStatus[currentQuestionIndex] === 'flagged' ? 'Flagged' : 'Flag'}
            </button>
          </div>
          <h3 class="text-base font-bold text-slate-900 leading-snug mb-5">${q.q}</h3>
          
          <div class="space-y-3">
            ${optionsHtml}
          </div>
        </div>

        ${isAnswered ? `
          <div class="bg-indigo-50 border border-indigo-200 rounded-2xl p-4 mb-4 animate-fade-in">
            <div class="flex items-center space-x-2 text-indigo-900 font-bold text-sm mb-1">
              <i class="fa-solid fa-lightbulb text-indigo-600"></i>
              <span>Answer Explanation:</span>
            </div>
            <p class="text-xs text-indigo-950 leading-relaxed">${q.explanation}</p>
          </div>
        ` : ''}

        <div class="grid grid-cols-2 gap-3 mb-6">
          <button onclick="prevQuestion()" ${currentQuestionIndex === 0 ? 'disabled opacity-50' : ''} class="py-3 bg-white border border-slate-200 hover:bg-slate-100 text-slate-700 font-bold rounded-2xl transition text-sm shadow-sm">
            <i class="fa-solid fa-arrow-left mr-1"></i> Previous
          </button>
          <button onclick="nextQuestion()" class="py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-2xl transition text-sm shadow-md shadow-indigo-200 flex items-center justify-center space-x-1">
            <span>${currentQuestionIndex === activeQuestions.length - 1 ? 'View Results' : 'Next'}</span>
            <i class="fa-solid fa-arrow-right ml-1"></i>
          </button>
        </div>

        <div class="bg-white rounded-3xl p-4 shadow-sm border border-slate-200 mb-6">
          <div class="flex justify-between items-center mb-3">
            <div class="flex items-center space-x-1.5 font-bold text-xs text-slate-800">
              <i class="fa-solid fa-list-check text-indigo-600"></i>
              <span>Question Navigation</span>
            </div>
            <span class="text-xs font-bold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-md">${answeredCount} / ${activeQuestions.length} Answered</span>
          </div>

          <div class="flex items-center justify-between text-[10px] text-slate-500 mb-3 px-1">
            <div class="flex items-center space-x-1"><div class="w-2.5 h-2.5 rounded-full bg-emerald-500"></div><span>Answered</span></div>
            <div class="flex items-center space-x-1"><div class="w-2.5 h-2.5 rounded-full bg-amber-400"></div><span>Flagged</span></div>
            <div class="flex items-center space-x-1"><div class="w-2.5 h-2.5 rounded-full bg-slate-200"></div><span>Unanswered</span></div>
          </div>

          <div class="grid grid-cols-5 gap-2 max-h-48 overflow-y-auto p-1">
            ${activeQuestions.map((_, idx) => {
              let bg = "bg-slate-50 text-slate-600 border-slate-200";
              if (userAnswers[idx] !== undefined) {
                bg = "bg-emerald-100 text-emerald-800 border-emerald-400 font-bold";
              }
              if (questionStatus[idx] === 'flagged') {
                bg = "bg-amber-100 text-amber-800 border-amber-400 font-bold";
              }
              if (idx === currentQuestionIndex) {
                bg += " ring-2 ring-indigo-600 ring-offset-1";
              }
              return `<button onclick="jumpToQuestion(${idx})" class="h-10 rounded-xl border text-xs font-semibold transition flex items-center justify-center ${bg}">${idx + 1}</button>`;
            }).join('')}
          </div>

          <button onclick="confirmSubmit()" class="w-full mt-4 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs transition shadow-md shadow-emerald-100 flex items-center justify-center space-x-2">
            <i class="fa-solid fa-paper-plane"></i>
            <span>Submit Exam</span>
          </button>
        </div>
      `;

      updateTimerDisplay();
    }

    function selectOption(optIndex) {
      userAnswers[currentQuestionIndex] = optIndex;
      questionStatus[currentQuestionIndex] = 'answered';
      renderExamQuestion();
    }

    function toggleFlag() {
      if (questionStatus[currentQuestionIndex] === 'flagged') {
        questionStatus[currentQuestionIndex] = userAnswers[currentQuestionIndex] !== undefined ? 'answered' : 'unanswered';
      } else {
        questionStatus[currentQuestionIndex] = 'flagged';
      }
      renderExamQuestion();
    }

    function prevQuestion() {
      if (currentQuestionIndex > 0) {
        currentQuestionIndex--;
        renderExamQuestion();
      }
    }

    function nextQuestion() {
      if (currentQuestionIndex < activeQuestions.length - 1) {
        currentQuestionIndex++;
        renderExamQuestion();
      } else {
        confirmSubmit();
      }
    }

    function jumpToQuestion(idx) {
      currentQuestionIndex = idx;
      renderExamQuestion();
    }

    function confirmSubmit() {
      const answeredCount = Object.keys(userAnswers).length;
      const unanswered = activeQuestions.length - answeredCount;
      
      let msg = `You have answered ${answeredCount} out of ${activeQuestions.length} questions.`;
      if (unanswered > 0) {
        msg += ` There are ${unanswered} unanswered questions remaining.`;
      }
      msg += ` Are you sure you want to submit your exam now?`;

      showCustomModal(
        'Submit Exam Answers',
        msg,
        'Yes, Submit',
        () => {
          clearInterval(timerInterval);
          currentScreen = 'results';
          renderScreen();
        },
        true
      );
    }

    function submitExam() {
      clearInterval(timerInterval);
      currentScreen = 'results';
      renderScreen();
    }

    function renderResults() {
      const main = document.getElementById('main-content');
      
      let score = 0;
      activeQuestions.forEach((q, idx) => {
        if (userAnswers[idx] === q.answer) {
          score++;
        }
      });

      const percentage = Math.round((score / activeQuestions.length) * 100);
      let badgeColor = "bg-emerald-100 text-emerald-800 border-emerald-300";
      let badgeText = "Excellent! Passed successfully.";
      if (percentage < 50) {
        badgeColor = "bg-rose-100 text-rose-800 border-rose-300";
        badgeText = "Needs Revision & Further Practice.";
      } else if (percentage < 80) {
        badgeColor = "bg-amber-100 text-amber-800 border-amber-300";
        badgeText = "Good Job, Almost Excellent!";
      }

      main.innerHTML = `
        <div class="flex flex-col items-center text-center my-auto py-4">
          <div class="w-24 h-24 bg-indigo-600 rounded-full flex items-center justify-center text-white shadow-xl shadow-indigo-200 mb-5 relative">
            <i class="fa-solid fa-trophy text-4xl"></i>
            <div class="absolute -bottom-2 bg-emerald-500 text-white text-[10px] font-bold px-2.5 py-0.5 rounded-full uppercase border-2 border-white">Set ${activeSetId} Completed</div>
          </div>

          <h2 class="text-2xl font-black text-slate-900 mb-1">IGCSE Simulation Results</h2>
          <p class="text-xs text-slate-500 mb-6">MRSM entrance preparation assessment report</p>

          <div class="w-full bg-white rounded-3xl p-6 shadow-sm border border-slate-200 mb-6">
            <div class="text-5xl font-extrabold text-indigo-600 mb-2">${score} <span class="text-2xl text-slate-400 font-bold">/ ${activeQuestions.length}</span></div>
            <p class="text-sm font-bold text-slate-700 mb-3">Total Score: <span class="text-indigo-600">${percentage}%</span></p>
            
            <div class="py-2 px-4 rounded-2xl border ${badgeColor} text-xs font-semibold inline-block">
              ${badgeText}
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3 w-full mb-6">
            <div class="bg-white p-4 rounded-2xl border border-slate-200 text-left">
              <span class="text-[10px] text-slate-400 uppercase font-bold tracking-wider">Correct</span>
              <p class="text-xl font-extrabold text-emerald-600">${score}</p>
            </div>
            <div class="bg-white p-4 rounded-2xl border border-slate-200 text-left">
              <span class="text-[10px] text-slate-400 uppercase font-bold tracking-wider">Incorrect / Blank</span>
              <p class="text-xl font-extrabold text-rose-600">${activeQuestions.length - score}</p>
            </div>
          </div>

          <div class="flex space-x-3 w-full">
            <button onclick="startExam()" class="flex-1 py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-2xl shadow-lg shadow-indigo-200 transition text-sm flex items-center justify-center space-x-2">
              <i class="fa-solid fa-rotate-right"></i>
              <span>Retake Set ${activeSetId}</span>
            </button>
            <button onclick="goHome()" class="flex-1 py-3.5 bg-white border border-slate-200 hover:bg-slate-100 text-slate-700 font-bold rounded-2xl transition text-sm flex items-center justify-center space-x-2">
              <i class="fa-solid fa-house"></i>
              <span>Home</span>
            </button>
          </div>
        </div>
      `;
    }

    function showCustomModal(title, message, confirmText, onConfirm, showCancel = false) {
      const modal = document.getElementById('custom-modal');
      const box = document.getElementById('modal-content-box');
      document.getElementById('modal-title').innerText = title;
      document.getElementById('modal-message').innerText = message;
      
      const actions = document.getElementById('modal-actions');
      if (showCancel) {
        actions.innerHTML = `
          <button onclick="closeModal()" class="flex-1 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-semibold transition">Cancel</button>
          <button id="modal-confirm-btn" class="flex-1 py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-semibold shadow-lg transition">${confirmText}</button>
        `;
        document.getElementById('modal-confirm-btn').onclick = () => {
          closeModal();
          if (onConfirm) onConfirm();
        };
      } else {
        actions.innerHTML = `
          <button onclick="closeModal()" class="flex-1 py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-semibold shadow-lg transition">${confirmText}</button>
        `;
      }

      modal.classList.remove('hidden');
      setTimeout(() => {
        box.classList.remove('scale-95', 'opacity-0');
        box.classList.add('scale-100', 'opacity-100');
      }, 10);
    }

    function closeModal() {
      const modal = document.getElementById('custom-modal');
      const box = document.getElementById('modal-content-box');
      box.classList.remove('scale-100', 'opacity-100');
      box.classList.add('scale-95', 'opacity-0');
      setTimeout(() => {
        modal.classList.add('hidden');
      }, 150);
    }

    function openMenuModal() {
      showCustomModal(
        'Information Menu',
        'IGCSE Simulation v2.5 features two comprehensive practice test sets designed for students preparing for MRSM selection exams, complete with answer explanations and progress tracking.',
        'Got it'
      );
    }
  </script>
</body>
</html>
